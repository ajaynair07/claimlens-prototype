<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaimLens prototype · claims-readiness companion for health policyholders</title>
<meta name="description" content="ClaimLens prototype: know what your health policy will actually pay, what could be deducted or rejected, what to submit, and where your claim stands. Synthetic data.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B6E8A'/%3E%3Ctext x='16' y='21' font-size='14' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3ECL%3C/text%3E%3C/svg%3E">
<style>
/* ClaimLens prototype - styles. Prototype with synthetic data. */
:root{
  --brand:#0B6E8A; --brand-ink:#084B5E; --brand-soft:#E4F2F6;
  --insurer:#1E2A52; --ink:#16202B; --muted:#5A6878; --line:#E1E7EE; --bg:#E9EEF3; --card:#fff; --soft:#F5F8FB;
  --ok:#147A4B; --ok-soft:#E3F4EA; --warn:#9A5800; --warn-soft:#FFF2DB; --risk:#B42318; --risk-soft:#FDE9E7;
  --info:#2457C5; --info-soft:#E8EEFC; --violet:#6B3FA0; --violet-soft:#F1EAF9; --np:#6F7B8B; --np-soft:#EEF1F4;
  --amber:#C26A00; --radius:14px; --fs:15px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:var(--fs)}
html.large{--fs:18.5px}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Nirmala UI","Noto Sans Devanagari",sans-serif;color:var(--ink);background:var(--bg);line-height:1.45}
button{font:inherit;cursor:pointer}
.sr{position:absolute;left:-9999px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 18px;background:#0F1B2A;color:#fff}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;letter-spacing:.2px}
.logo .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#19A3C4,#0B6E8A);display:grid;place-items:center;font-size:.8rem}
.logo small{font-weight:400;opacity:.7;font-size:.75rem}
.tb-group{display:flex;align-items:center;gap:6px}
.tb-label{font-size:.75rem;opacity:.75}
.topbar select{font:inherit;font-size:.85rem;padding:5px 8px;border-radius:8px;border:1px solid #3A4B61;background:#17283C;color:#fff}
.seg{display:inline-flex;border:1px solid #3A4B61;border-radius:9px;overflow:hidden}
.seg button{background:transparent;color:#cfd8e3;border:0;padding:5px 10px;font-size:.82rem}
.seg button.on{background:#19A3C4;color:#06222C;font-weight:600}
.tb-btn{background:#17283C;color:#e6edf5;border:1px solid #3A4B61;border-radius:9px;padding:5px 10px;font-size:.82rem}
.tb-btn.on{background:#19A3C4;color:#06222C;border-color:#19A3C4;font-weight:600}
.spacer{flex:1}

/* stage */
.stage{display:grid;grid-template-columns:minmax(340px,440px) minmax(260px,400px);gap:26px;justify-content:center;align-items:start;padding:20px 18px 10px}
.device{background:#fff;border-radius:26px;box-shadow:0 18px 40px rgba(15,27,42,.18),0 0 0 8px #0F1B2A;overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 110px);min-height:640px;max-height:900px}
.app-head{background:var(--insurer);color:#fff;padding:12px 16px 10px}
.app-head .row{display:flex;align-items:center;gap:10px}
.ins-logo{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--insurer);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.app-head .t1{font-weight:600}
.app-head .t2{font-size:.75rem;opacity:.8}
.app-head .cl{margin-left:auto;font-size:.68rem;background:rgba(255,255,255,.14);padding:3px 8px;border-radius:999px}
.steps{display:flex;gap:4px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.steps button{flex:1;min-width:58px;border:0;background:transparent;padding:4px 2px;border-radius:8px;color:var(--muted);font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:3px}
.steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-weight:700;font-size:.72rem}
.steps button.on{color:var(--brand-ink);font-weight:600}
.steps button.on .n{background:var(--brand);color:#fff;border-color:var(--brand)}
.steps button.done .n{background:var(--ok-soft);color:var(--ok);border-color:#BFE3CF}
.screen{flex:1;overflow-y:auto;padding:14px 14px 18px;background:var(--soft);scroll-behavior:smooth}
.app-foot{display:flex;gap:8px;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line);background:#fff}

/* rail */
.rail{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 6px 18px rgba(15,27,42,.08);position:sticky;top:76px}
.rail h3{margin:0 0 2px;font-size:.78rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.rail h2{margin:0 0 10px;font-size:1.05rem}
.rail ul{margin:0 0 10px;padding-left:18px;font-size:.88rem}
.rail li{margin:4px 0}
.rail .box{border-radius:10px;padding:9px 11px;margin:8px 0;font-size:.84rem}
.rail .guard{background:var(--risk-soft);color:#7A1A12}
.rail .value{background:var(--ok-soft);color:#0E5233}
.rail .ai{background:var(--info-soft);color:#173E8F}
.rail .foot{font-size:.74rem;color:var(--muted);margin-top:10px}
.disclaimer{text-align:center;font-size:.74rem;color:var(--muted);padding:6px 12px 16px}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:11px}
.card h4{margin:0 0 6px;font-size:.98rem}
.card p{margin:4px 0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.xs{font-size:.74rem}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 13px;font-size:.88rem}
.btn:hover{border-color:#B9C6D3}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--brand-ink)}
.btn-soft{background:var(--brand-soft);border-color:#C3E2EA;color:var(--brand-ink);font-weight:600}
.btn-link{border:0;background:none;color:var(--brand);padding:2px 0;font-size:.82rem;font-weight:600}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.c-high{background:var(--ok-soft);color:var(--ok)}
.c-medium{background:var(--warn-soft);color:var(--warn)}
.c-low{background:var(--risk-soft);color:var(--risk)}
.c-info{background:var(--info-soft);color:var(--info)}
.c-np{background:var(--np-soft);color:var(--np)}
.c-violet{background:var(--violet-soft);color:var(--violet)}
.ref{font-size:.72rem;color:var(--brand-ink);background:var(--brand-soft);border-radius:6px;padding:1px 6px;font-weight:600;white-space:nowrap}
.hero{background:linear-gradient(135deg,#0B6E8A,#12445E);color:#fff;border:0}
.hero .muted{color:#CFE6EE}
.avatar{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--brand-ink);display:grid;place-items:center;font-weight:700;flex:none}
.pill-note{font-size:.76rem;background:rgba(255,255,255,.15);border-radius:8px;padding:6px 8px;margin-top:8px}
.consent{border-left:4px solid var(--brand)}
.sec-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 2px 7px;font-weight:700}

/* cover */
.term{display:grid;grid-template-columns:34px 1fr;gap:10px}
.term .ic{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center;font-size:1.05rem}
.term .val{font-weight:700;color:var(--brand-ink);font-size:.92rem}
.clause{margin-top:8px;background:#FBF7EC;border-left:3px solid #C9A227;font-family:Georgia,"Times New Roman",serif;font-size:.8rem;padding:8px 10px;border-radius:0 8px 8px 0;color:#3B3320}
.reading{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.reading i{display:block;height:100%;width:0;background:var(--brand);animation:fill 1.6s ease forwards}
@keyframes fill{to{width:100%}}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{border:1px solid #BFDCE5;background:#fff;color:var(--brand-ink);border-radius:999px;padding:5px 10px;font-size:.8rem}
.qchip.used{opacity:.55}
.qa .q{font-weight:600;margin-bottom:4px}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:9px 12px;border-radius:14px;font-size:.9rem}
.msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-top-left-radius:4px}
.msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-top-right-radius:4px}
.msg.card-msg{background:#fff;border:1px solid #CFE3D8;border-left:4px solid var(--ok)}
.msg.case-msg{background:#fff;border:1px solid #C8D7F3;border-left:4px solid var(--info)}
.typing{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;color:var(--muted);font-size:.8rem}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.opt{border:1px solid var(--brand);color:var(--brand-ink);background:#fff;border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600}
.opt.alt{border-color:var(--line);color:var(--muted);font-weight:400}
.composer{display:flex;gap:6px;margin-top:10px}
.composer input{flex:1;font:inherit;font-size:.88rem;padding:9px 11px;border:1px solid var(--line);border-radius:10px}
.mic{width:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:1rem}
.mic.on{background:var(--risk-soft);border-color:#F3B8B1;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* paid */
.variant{display:flex;gap:6px;margin-bottom:10px}
.variant button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px;font-size:.84rem}
.variant button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.nums .k{font-size:.72rem;color:var(--muted)}
.nums .v{font-size:1.18rem;font-weight:800}
.nums .v.pay{color:var(--ok)}
.nums .v.you{color:var(--risk)}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 6px;background:var(--line)}
.bar span{display:block;height:100%}
.s-paid{background:#1F9D63}.s-np{background:#9AA5B3}.s-prop{background:#E58A1F}.s-sub{background:#D2463A}.s-copay{background:#7E57C2}.s-mt{background:#D2463A}.s-si{background:#8B1E14}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.72rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.why{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-top:1px dashed var(--line);font-size:.86rem}
.why:first-of-type{border-top:0}
.why .sw{width:10px;height:10px;border-radius:3px;margin-top:5px}
.why .amt{font-weight:700;white-space:nowrap}
.whatif{background:#FFFDF6;border:1px solid #F1DFAE}
.items{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:6px}
.items td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:top}
.items td.r{text-align:right;white-space:nowrap}
.flag{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.86rem}
.flag:first-of-type{border-top:0}
.flag .fi{font-size:1rem;line-height:1.3}
.meter{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0}
.meter i{display:block;height:100%;background:var(--brand)}
.meter i.after{background:#7FC4D6}
.note{font-size:.76rem;color:var(--muted);background:#fff;border:1px dashed #C9D3DD;border-radius:10px;padding:8px 10px}
ul.qs{margin:4px 0 0;padding-left:18px;font-size:.86rem}
ul.qs li{margin:3px 0}

/* prepare */
.doc{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.doc:first-of-type{border-top:0}
.doc .di{font-size:1.05rem}
.doc .dn{font-weight:600;font-size:.88rem}
.doc .dc{font-size:.8rem;color:var(--muted)}
.scan{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0}
.scan i{display:block;height:100%;width:30%;background:var(--brand);animation:scan 1s ease-in-out infinite alternate}
@keyframes scan{from{margin-left:0}to{margin-left:70%}}
.ready{display:flex;gap:6px;flex-wrap:wrap}

/* track */
.owner{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.owner .avatar{background:var(--brand-soft)}
.ball{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--info-soft);color:var(--info)}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clock{border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:#fff}
.clock .cv{font-weight:800;font-size:1rem}
.clock.ok{border-color:#BFE3CF;background:#F4FBF7}
.clock.bad{border-color:#F3B8B1;background:#FFF6F5}
.tl{position:relative;margin-left:8px;padding-left:18px;border-left:2px solid var(--line)}
.ev{position:relative;padding:2px 0 12px}
.ev .dot{position:absolute;left:-26px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--brand)}
.ev.alert .dot{border-color:var(--risk)}
.ev.new{animation:slidein .45s ease}
@keyframes slidein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ev .when{font-size:.74rem;color:var(--muted);font-weight:600}
.ev .what{font-size:.88rem}
.ev .who{font-size:.68rem;text-transform:uppercase;letter-spacing:.4px;font-weight:700;color:var(--muted);margin-left:6px}
.ev.alert .what{color:#7A1A12;background:var(--risk-soft);border-radius:8px;padding:6px 8px;margin-top:3px}
.recon{border-left:4px solid var(--ok)}
textarea.draft{width:100%;min-height:180px;font:inherit;font-size:.8rem;border:1px solid var(--line);border-radius:10px;padding:9px;background:#FCFCFD}
.path{display:flex;flex-direction:column;gap:6px;font-size:.82rem}
.path div{display:flex;gap:8px;align-items:flex-start}
.path b{min-width:20px;height:20px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-size:.72rem}
.hr-view{background:#FBFCFE;border:1px dashed #B9C9E6}

/* insurer view */
.ins-wrap{max-width:1180px;margin:0 auto;padding:20px 18px 6px}
.ins-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.ins-head h1{margin:0;font-size:1.35rem}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:13px 14px;border:1px solid var(--line)}
.kpi .k{font-size:.76rem;color:var(--muted)}
.kpi .v{font-size:1.45rem;font-weight:800;margin:2px 0}
.kpi .s{font-size:.76rem}
table.cases{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:.84rem}
table.cases th{text-align:left;background:#F2F5F9;font-size:.74rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:9px 10px}
table.cases td{padding:10px;border-top:1px solid var(--line);vertical-align:top}
.ins-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}

/* modal + toast */
.backdrop{position:fixed;inset:0;background:rgba(15,27,42,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:18px}
.modal h3{margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0F1B2A;color:#fff;padding:10px 16px;border-radius:12px;font-size:.86rem;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}

@media (max-width:900px){
  .stage{grid-template-columns:1fr;padding:12px}
  .device{height:auto;max-height:none;min-height:0;box-shadow:0 0 0 1px var(--line);border-radius:18px}
  .screen{overflow:visible}
  .rail{position:static}
  .kpis{grid-template-columns:1fr 1fr}
  .ins-grid{grid-template-columns:1fr}
}
@media print{.topbar{position:static}}
html.shot .topbar,html.shot .rail,html.shot .disclaimer{display:none}
html.shot body{background:#fff}
html.shot .stage{display:block;padding:0}
html.shot .device{height:100vh;max-height:none;min-height:0;border-radius:0;box-shadow:none}

</style>
<script>
  window.__errors = [];
  window.addEventListener('error', function (e) { window.__errors.push(String(e.message) + ' @' + (e.filename || '') + ':' + (e.lineno || '')); var d = document.getElementById('errs'); if (d) d.textContent = window.__errors.join(' | '); });

    <div class="screen" id="screen"></div>
    <div class="app-foot" id="appfoot"></div>
  </section>
  <aside class="rail" id="rail" aria-label="Presenter notes"></aside>
</main>
<section id="ins" hidden></section>
<p class="disclaimer" id="disc"></p>
<div id="overlay"></div>
<div id="errs" hidden></div>
<script>
/* ClaimLens prototype - shared data. All people, policies, hospitals and numbers are synthetic. */
window.CL = window.CL || {};
(function (CL) {
  const L = (en, hi) => ({ en, hi });
  CL.L = L;
  CL.INR = n => '\u20B9' + Math.round(n).toLocaleString('en-IN');

  CL.ui = {

    agree: L('I agree, continue', 'मैं सहमत हूँ, आगे बढ़ें'),
    agreed: L('Consent recorded', 'सहमति दर्ज'),
    readPolicy: L('Read my policy', 'मेरी पॉलिसी पढ़ें'),
    reading: L('Reading your policy: finding limits, waiting periods and exclusions…', 'आपकी पॉलिसी पढ़ी जा रही है: सीमाएँ, प्रतीक्षा अवधि और अपवाद खोजे जा रहे हैं…'),
    found: L('key terms found, each linked to its clause', 'मुख्य शर्तें मिलीं, हर एक अपनी शर्त से जुड़ी'),
    showClause: L('Show clause', 'शर्त देखें'), hideClause: L('Hide clause', 'शर्त छिपाएँ'),

<script>
/* ClaimLens prototype - deterministic payout calculator.
   The LLM never does money maths. It only reads documents into structured terms and line items;
   this rule engine applies them in a fixed, auditable order:
   1) remove non-payable items  2) room-rent proportionate deduction on associated expenses only
   3) treatment sub-limit  4) modern-treatment limit  5) co-payment  6) remaining sum insured. */
window.CL = window.CL || {};
(function (CL) {
  const ASSOC = { room: 1, nursing: 1, fees: 1, ot: 1 };
  const sum = a => a.reduce((s, x) => s + x, 0);

  CL.compute = function (policy, estimate, variantKey, opts) {
    opts = opts || {};
    const v = estimate.variants[variantKey];
    const rate = opts.roomRate != null ? opts.roomRate : estimate.roomRate;
    const items = v.items.map(it => Object.assign({}, it));
    if (opts.roomRate != null) items.forEach(it => { if (it.kind === 'room') it.amount = opts.roomRate * v.days; });
    (opts.adjust || []).forEach(a => { const it = items.find(i => i.id === a.id); if (it) it.amount += a.delta; });

    const total = sum(items.map(i => i.amount));
    const np = sum(items.filter(i => i.kind === 'np').map(i => i.amount));
    let ratio = 1, prop = 0;
    if (policy.roomCap && rate && rate > policy.roomCap) {
      ratio = policy.roomCap / rate;
      prop = Math.round(sum(items.filter(i => ASSOC[i.kind]).map(i => i.amount)) * (1 - ratio));
    }
    items.forEach(i => { i.status = i.kind === 'np' ? 'np' : (ratio < 1 && ASSOC[i.kind] ? 'reduced' : 'payable'); });

    let admissible = total - np - prop;
    let sub = 0, subLimit = null;
    if (v.sublimit && policy.sublimits && policy.sublimits[v.sublimit] != null) {
      subLimit = policy.sublimits[v.sublimit];
      if (admissible > subLimit) { sub = admissible - subLimit; admissible = subLimit; }
    }
    let mt = 0;
    const mtUsed = sum(items.filter(i => i.mt).map(i => i.amount));
    if (policy.mtRemaining != null && mtUsed > policy.mtRemaining) { mt = mtUsed - policy.mtRemaining; admissible -= mt; }
    const copay = Math.round(admissible * (policy.copay || 0));
    let payable = admissible - copay, si = 0;
    if (policy.siAvailable != null && payable > policy.siAvailable) { si = payable - policy.siAvailable; payable = policy.siAvailable; }
    return { total, np, prop, ratio, sub, subLimit, mt, mtUsed, copay, si, payable, youPay: total - payable, items, rate, days: v.days };
  };

  /* Builds every number a scenario needs, so screens, timeline text and the insurer view always agree. */
  CL.results = function (sc, variantKey) {
    const p = sc.policy, e = sc.estimate;
    const key = variantKey || e.defaultVariant;
    const est = CL.compute(p, e, key);
    const alt = e.altRoom ? CL.compute(p, e, key, { roomRate: e.altRoom.rate }) : null;
    const f = sc.final;
    const expected = CL.compute(p, e, f.variant, { roomRate: f.roomRate });
    const fin = CL.compute(p, e, f.variant, { roomRate: f.roomRate, adjust: f.adjust });
    const finEstimate = CL.compute(p, e, f.variant);
    return { est, alt, expected, final: fin, finEstimate, variant: key };
  };
})(window.CL);

</script>

    refs: { np: 'Annexure I', mt: 'C.7.2' },
    flags: r => [
      { lv: 'certain', ref: 'C.7.2', conf: 'high', text: L(`This cycle uses ${INR(r.est.mtUsed)} of your modern-treatment limit. ${INR(374000 - r.est.mtUsed)} will be left until 31 Jan 2027.`, `यह चक्र आपकी मॉडर्न ट्रीटमेंट सीमा के ${INR(r.est.mtUsed)} इस्तेमाल करेगा। 31 जनवरी 2027 तक ${INR(374000 - r.est.mtUsed)} बचेंगे।`) },
      { lv: 'check', ref: 'C.7.2', conf: 'medium', text: L('If cycles continue every 3 weeks, the limit should last until renewal. A change in the treatment plan could change this.', 'अगर चक्र हर 3 हफ़्ते में चलते रहे, तो सीमा रिन्यूअल तक चलनी चाहिए। इलाज योजना बदलने पर यह बदल सकता है।') },
      { lv: 'certain', ref: 'Annexure I', conf: 'high', text: L(`About ${INR(r.est.np)} of items are on the non-payable list.`, `लगभग ${INR(r.est.np)} की चीज़ें देय-नहीं सूची में हैं।`) },
      { lv: 'check', ref: 'G.2', conf: 'high', text: L('Renewal is due on 1 Feb 2027. A lapse would interrupt cover in the middle of treatment. Reminder set.', 'रिन्यूअल 1 फ़रवरी 2027 को है। लैप्स होने पर इलाज के बीच कवर रुक जाएगा। रिमाइंडर सेट।') },
      { lv: 'info', ref: 'Section A', conf: 'high', text: L('Your health policy does not replace lost income. Check any critical illness or employer cover you may have.', 'आपकी स्वास्थ्य पॉलिसी आय के नुकसान की भरपाई नहीं करती। अगर कोई क्रिटिकल इलनेस या नियोक्ता कवर है तो देखें।') }
    ],
    questions: [L('How many cycles are planned, and how far apart?', 'कितने चक्र तय हैं, और कितने अंतर पर?'), L('Are there equally suitable options that cost less, such as biosimilars?', 'क्या उतने ही उपयुक्त, कम ख़र्च वाले विकल्प हैं, जैसे बायोसिमिलर?'), L("Can each cycle's bill show the targeted therapy as a separate line?", 'क्या हर चक्र के बिल में टार्गेटेड थेरेपी अलग लाइन में दिख सकती है?'), L('If a cycle is delayed, what happens to the plan?', 'अगर कोई चक्र देर से हो, तो योजना पर क्या असर होगा?')],
    docs: [
      { name: L('Biopsy (histopathology) report', 'बायोप्सी (हिस्टोपैथोलॉजी) रिपोर्ट'), pre: 'ok', status: 'ok', check: L('On file since cycle 1; reused.', 'चक्र 1 से रिकॉर्ड में; दोबारा इस्तेमाल।') },
      { name: L("Oncologist's treatment plan", 'ऑन्कोलॉजिस्ट की इलाज योजना'), pre: 'ok', status: 'ok', check: L('On file: 6 chemotherapy cycles; targeted therapy for one year.', 'रिकॉर्ड में: 6 कीमोथेरेपी चक्र; एक साल टार्गेटेड थेरेपी।') },
      { name: L('Cycle 4 prescription', 'चक्र 4 का पर्चा'), pre: 'up', status: 'ok', check: L('Dated 28 Oct; matches the 7 Nov cycle.', '28 अक्टूबर का; 7 नवंबर के चक्र से मेल खाता है।') },
      { name: L('Cycle 4 estimate', 'चक्र 4 का एस्टिमेट'), pre: 'up', status: 'ok', check: L('Read: ₹84,000.', 'पढ़ा गया: ₹84,000।') },
      { name: L('Photo ID & e-card', 'फ़ोटो ID और ई-कार्ड'), pre: 'ok', status: 'ok', check: L('On file.', 'रिकॉर्ड में।') },
      { name: L('Cycle 3 reimbursement bills', 'चक्र 3 रीइम्बर्समेंट बिल'), pre: 'ok', status: 'ok', check: L('Settled on 24 Oct; nothing pending.', '24 अक्टूबर को सेटल; कुछ बाक़ी नहीं।') }
    ],
    intimation: { kind: 'planned', rule: L('Planned day care: tell your insurer at least 48 hours before (Clause E.1.1).', 'तय डे-केयर: कम से कम 48 घंटे पहले बीमा कंपनी को बताएँ (शर्त E.1.1)।'), ref: 'INT-26-91207', sent: L('Notice sent for cycle 4 on 7 Nov. Ref INT-26-91207.', '7 नवंबर के चक्र 4 की सूचना भेजी गई। संदर्भ INT-26-91207।') },
    owner: { name: 'Sunita Rao', initials: 'SR', role: L('Serious illness care team, Your Insurer', 'गंभीर बीमारी देखभाल टीम, आपकी बीमा कंपनी') },
    timeline: [
      { when: 'Aug 2026', who: 'insurer', ball: 'closed', text: L('Claim 1, surgery: settled ₹2,40,000 (cashless).', 'क्लेम 1, सर्जरी: ₹2,40,000 सेटल (कैशलेस)।') },
      { when: 'Sep 2026', who: 'insurer', ball: 'closed', text: L('Cycles 1 and 2: settled ₹79,000 and ₹80,500 (cashless).', 'चक्र 1 और 2: ₹79,000 और ₹80,500 सेटल (कैशलेस)।') },
      { when: '06 Oct → 24 Oct', who: 'insurer', ball: 'closed', text: L('Cycle 3: reimbursement claim settled ₹81,000 in 18 days (the cashless desk was closed that Sunday).', 'चक्र 3: रीइम्बर्समेंट क्लेम ₹81,000, 18 दिनों में सेटल (उस रविवार कैशलेस डेस्क बंद था)।') },
      { when: '07 Nov · 09:10', who: 'hospital', ball: 'insurer', req: '1h', text: L('Cycle 4: hospital sent a day-care cashless request for ₹84,000.', 'चक्र 4: अस्पताल ने ₹84,000 का डे-केयर कैशलेस अनुरोध भेजा।') },
      { when: '07 Nov · 09:41', who: 'insurer', ball: 'hospital', tat: { rule: '1h', mins: 31 }, approved: 83000, text: L('Approved ₹83,000 (₹1,000 is non-payable).', '₹83,000 मंज़ूर (₹1,000 देय नहीं)।') },
      { when: '07 Nov · 15:15', who: 'hospital', ball: 'insurer', req: '3h', text: r => L(`Treatment done. Final bill ${INR(r.final.total)} sent.`, `इलाज पूरा। अंतिम बिल ${INR(r.final.total)} भेजा गया।`) },
      { when: '07 Nov · 16:20', who: 'insurer', ball: 'you', tat: { rule: '3h', mins: 65 }, approved: r => r.final.payable, text: r => L(`Final approval ${INR(r.final.payable)}. You pay ${INR(r.final.youPay)}. Limits updated: ${INR(619500 - r.final.payable)} sum insured and ${INR(374000 - r.final.mtUsed)} modern-treatment limit left.`, `अंतिम मंज़ूरी ${INR(r.final.payable)}। आप ${INR(r.final.youPay)} देंगी। सीमाएँ अपडेट: ${INR(619500 - r.final.payable)} बीमा राशि और ${INR(374000 - r.final.mtUsed)} मॉडर्न ट्रीटमेंट सीमा बाक़ी।`) },
      { when: '07 Nov · 16:40', who: 'you', ball: 'closed', text: L('Cycle 5 is pre-filled for 28 Nov. Renewal reminder set for 1 Feb 2027.', 'चक्र 5, 28 नवंबर के लिए पहले से तैयार। रिन्यूअल रिमाइंडर 1 फ़रवरी 2027 के लिए सेट।') }
    ],
    final: { variant: 'main', adjust: [] },
    reconWhy: L('The bill matched the estimate exactly.', 'बिल अनुमान से बिल्कुल मेल खाता है।'),
    escalation: { title: L('Confirm how the modern-treatment limit applies', 'मॉडर्न ट्रीटमेंट सीमा कैसे लागू होती है, पुष्टि करें'), draft: L(
      'To: Grievance Officer, Your Insurer\nPolicy: HPL-2019-207781 · Claim: CL-26-0602 (cycle 4) · Patient: Meena Joshi\nSubject: Written confirmation of the modern-treatment limit\n\nI am receiving targeted therapy (a monoclonal antibody) every 3 weeks as day care. Please confirm in writing (1) the amount of the modern-treatment limit used so far this policy year, and (2) that the limit resets at renewal on 1 Feb 2027 under Clause C.7.2.\n\nRegards,\nMeena Joshi',
      'सेवा में: शिकायत अधिकारी, आपकी बीमा कंपनी\nपॉलिसी: HPL-2019-207781 · क्लेम: CL-26-0602 (चक्र 4) · मरीज़: मीना जोशी\nविषय: मॉडर्न ट्रीटमेंट सीमा की लिखित पुष्टि\n\nमुझे हर 3 हफ़्ते डे-केयर में टार्गेटेड थेरेपी (मोनोक्लोनल एंटीबॉडी) दी जा रही है। कृपया लिखित में पुष्टि करें (1) इस पॉलिसी वर्ष में अब तक मॉडर्न ट्रीटमेंट सीमा की कितनी राशि इस्तेमाल हुई है, और (2) शर्त C.7.2 के तहत यह सीमा 1 फ़रवरी 2027 को रिन्यूअल पर फिर शुरू होगी।\n\nसादर,\nमीना जोशी') }
  };
})(window.CL);

</script>
<script>
/* ClaimLens prototype - app core: state, actions, chat engine, shell rendering. */
window.CL = window.CL || {};
(function (CL) {
  'use strict';
  const S = CL.state = {};
  const qs = new URLSearchParams(location.search);
  const $ = sel => document.querySelector(sel);

  CL.t = x => (x == null ? '' : typeof x === 'string' ? x : (x[S.lang] || x.en));
  CL.esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  CL.T = x => CL.esc(CL.t(x));
  CL.sc = () => CL.scenarios[S.scenario];
  CL.res = () => CL.results(CL.sc(), S.variant);
  CL.val = (x, r) => (typeof x === 'function' ? x(r || CL.res()) : x);

  function resetScenario() {
    const sc = CL.sc();
    Object.assign(S, { step: 0, consent: false, policyRead: false, reading: false, clauses: {}, asked: [], chatIdx: 0, chatLog: [], chatBusy: false, chatDone: false, listening: false, variant: sc.estimate.defaultVariant, whatIf: false, showItems: false, precheck: 'idle', fixed: {}, intimated: false, tlIdx: 0, escalate: false, gSent: false, hrShare: false });
  }

  /* ---------- chat engine ---------- */
  function pushBot(i) {
    const st = CL.sc().chat[i];
    if (!st) return;
    st.bot.forEach(m => S.chatLog.push({ from: 'bot', m }));
    if (!st.opts.length) S.chatDone = true;
  }
  CL.mainOpt = () => { const st = CL.sc().chat[S.chatIdx]; return st && st.opts.find(o => !o.alt); };
  CL.chatStart = () => { if (!S.chatLog.length) pushBot(0); };
  function applyEffect(opt) { if (!opt) return; if (opt.effect === 'intimate') S.intimated = true; if (opt.effect === 'hr') S.hrShare = true; }
  CL.chatAnswer = function (label, opt) {
    if (S.chatBusy || S.chatDone) return;
    S.chatLog.push({ from: 'user', m: label });
    applyEffect(opt);
    S.chatIdx++;
    if (S.instant) { pushBot(S.chatIdx); CL.render(); return; }
    S.chatBusy = true; CL.render();
    setTimeout(() => { S.chatBusy = false; pushBot(S.chatIdx); CL.render(); }, 800);
  };
  function completeChat() {
    CL.chatStart();
    let guard = 0;
    while (!S.chatDone && guard++ < 20) { const o = CL.mainOpt(); S.chatLog.push({ from: 'user', m: o.label }); applyEffect(o); S.chatIdx++; pushBot(S.chatIdx); }
  }

  /* ---------- toast + modal ---------- */
  let toastTimer;
  CL.toast = function (msg) {
    let el = $('#toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
  };
  CL.modal = function (html) { $('#overlay').innerHTML = html ? `<div class="backdrop" data-a="close"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>` : ''; };

  /* ---------- actions ---------- */
  const A = CL.actions = {
    scenario: v => { if (!CL.scenarios[v]) return; S.scenario = v; resetScenario(); CL.render(true); },
    lang: v => { S.lang = v === 'hi' ? 'hi' : 'en'; CL.render(); },
    large: () => { S.large = !S.large; CL.render(); },
    view: v => { S.view = v; CL.render(true); },
    restart: () => { resetScenario(); CL.render(true); },
    go: v => { S.step = Math.max(0, Math.min(5, +v)); if (S.step >= 1) S.consent = true; if (S.step === 2) CL.chatStart(); CL.render(true); },
    next: () => A.go(S.step + 1),
    back: () => A.go(S.step - 1),
    consent: () => { S.consent = true; A.go(1); },
    read: () => {
      if (S.policyRead || S.reading) return;
      if (S.instant) { S.policyRead = true; return CL.render(); }
      S.reading = true; CL.render();
      setTimeout(() => { S.reading = false; S.policyRead = true; CL.render(); }, 1700);
    },
    clause: v => { S.clauses[v] = !S.clauses[v]; CL.render(); },
    ask: v => { const i = +v; if (!S.asked.includes(i)) S.asked.push(i); CL.render(); },
    expert: () => CL.modal(`<h3>🧑‍💼 ${CL.T(CL.ui.expertTitle)}</h3><p class="small">${CL.T(CL.ui.expertBody)}</p><p class="xs muted">${CL.esc(CL.sc().owner.name)} · ${CL.T(CL.sc().owner.role)}</p><button class="btn btn-primary btn-block" data-a="close">${CL.T(CL.ui.close)}</button>`),
    close: (v, el, e) => { if (e && e.target.closest('.modal') && !e.target.closest('[data-a="close"].btn')) return; CL.modal(''); },
    opt: v => {
      const st = CL.sc().chat[S.chatIdx]; if (!st) return;
      const o = st.opts[+v]; if (!o) return;
      if (o.alt) return CL.toast(CL.t(CL.ui.protoPath));
      CL.chatAnswer(o.label, o);
    },
    send: () => { const inp = $('#chatIn'); if (!inp || !inp.value.trim()) return; const text = inp.value.trim(); inp.value = ''; CL.chatAnswer(text, CL.mainOpt()); },
    mic: () => {
      if (S.listening || S.chatBusy || S.chatDone) return;
      const st = CL.sc().chat[S.chatIdx]; const o = CL.mainOpt();
      const phrase = '🎙 ' + CL.t(st.voice || o.label);
      S.listening = true; CL.render();
      setTimeout(() => { S.listening = false; CL.chatAnswer(phrase, o); }, S.instant ? 0 : 1400);
    },
    variant: v => { S.variant = v; CL.render(); },
    whatif: () => { S.whatIf = !S.whatIf; CL.render(); },
    items: () => { S.showItems = !S.showItems; CL.render(); },
    notice: () => { S.intimated = true; CL.toast(CL.t(CL.sc().intimation.sent)); CL.render(); },
    precheck: () => {
      if (S.precheck !== 'idle') return;
      if (S.instant) { S.precheck = 'done'; return CL.render(); }
      S.precheck = 'running'; CL.render();
      setTimeout(() => { S.precheck = 'done'; CL.render(); }, 1500);
    },
    fix: v => { S.fixed[v] = true; CL.render(); },
    tl: () => { S.tlIdx = Math.min(CL.sc().timeline.length, S.tlIdx + 1); CL.render(); const sc = $('#screen'); if (sc) sc.scrollTop = sc.scrollHeight; },
    tlall: () => { S.tlIdx = CL.sc().timeline.length; CL.render(); },
    esc: () => { S.escalate = !S.escalate; CL.render(); },
    gsend: () => { S.gSent = true; CL.toast(CL.t(CL.ui.grievanceSent)); CL.render(); },
    speak: () => {
      if (!('speechSynthesis' in window)) return CL.toast(CL.t(CL.ui.speakNA));
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(CL.screens.speech());
      u.lang = S.lang === 'hi' ? 'hi-IN' : 'en-IN'; u.rate = 0.95;
      const vs = speechSynthesis.getVoices();
      const v = vs.find(x => x.lang && x.lang.toLowerCase().startsWith(S.lang === 'hi' ? 'hi' : 'en-in')) || vs.find(x => x.lang && x.lang.toLowerCase().startsWith(S.lang === 'hi' ? 'hi' : 'en'));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    }
  };

  /* ---------- shell rendering ---------- */
  CL.render = function (toTop) {
    const html = document.documentElement;
    html.classList.toggle('large', S.large);
    html.lang = S.lang === 'hi' ? 'hi' : 'en';
    const sc = CL.sc(), ui = CL.ui;
    $('#topbar').innerHTML = `
      <div class="logo"><span class="mark">CL</span>ClaimLens <small>prototype</small></div>
      <div class="tb-group"><span class="tb-label">Scenario</span><select id="scSel" aria-label="Scenario">${CL.order.map(k => `<option value="${k}"${k === S.scenario ? ' selected' : ''}>${CL.T(CL.scenarios[k].label)}</option>`).join('')}</select></div>
      <div class="seg" role="group" aria-label="View"><button data-a="view" data-v="user" class="${S.view === 'user' ? 'on' : ''}">Policyholder</button><button data-a="view" data-v="insurer" class="${S.view === 'insurer' ? 'on' : ''}">Insurer view</button></div>
      <span class="spacer"></span>
      <div class="seg" role="group" aria-label="Language"><button data-a="lang" data-v="en" class="${S.lang === 'en' ? 'on' : ''}">EN</button><button data-a="lang" data-v="hi" class="${S.lang === 'hi' ? 'on' : ''}">हिंदी</button></div>
      <button class="tb-btn ${S.large ? 'on' : ''}" data-a="large" aria-pressed="${S.large}">Aa ${S.lang === 'hi' ? 'बड़े अक्षर' : 'Large text'}</button>
      <button class="tb-btn" data-a="speak">🔊 ${S.lang === 'hi' ? 'सुनें' : 'Read aloud'}</button>
      <button class="tb-btn" data-a="restart">↺ ${S.lang === 'hi' ? 'फिर से' : 'Restart'}</button>`;
    $('#disc').textContent = CL.t(ui.proto);
    const insurer = S.view === 'insurer';
    $('#stage').hidden = insurer; $('#ins').hidden = !insurer;
    if (insurer) { $('#ins').innerHTML = CL.screens.insurer(); return; }
    $('#apphead').innerHTML = `<div class="row"><div class="ins-logo">YI</div><div><div class="t1">${CL.T(ui.insurer)} · ${CL.T(ui.claimHelp)}</div><div class="t2">${CL.T(sc.cover)} · ${CL.esc(sc.policy.number)}</div></div><span class="cl">${CL.T(ui.inside)}</span></div>`;
    $('#steps').innerHTML = ui.steps.map((s, i) => `<button data-a="go" data-v="${i}" class="${i === S.step ? 'on' : ''} ${i < S.step ? 'done' : ''}" aria-current="${i === S.step ? 'step' : 'false'}"><span class="n">${i < S.step ? '✓' : i + 1}</span>${CL.T(s)}</button>`).join('');
    const scr = $('#screen');
    const prevTop = scr.scrollTop;
    scr.innerHTML = CL.screens.step(S.step);
    if (toTop) scr.scrollTop = 0;
    else if (S.step === 2) scr.scrollTop = scr.scrollHeight;
    else scr.scrollTop = prevTop;
    const canNext = S.step < 5 && (S.step > 0 || S.consent);
    $('#appfoot').innerHTML = `<button class="btn" data-a="back" ${S.step === 0 ? 'disabled' : ''}>← ${CL.T(ui.back)}</button><button class="btn btn-primary" data-a="next" ${canNext ? '' : 'disabled'}>${CL.T(S.step === 5 ? ui.finish : ui.next)} →</button>`;
    $('#rail').innerHTML = CL.screens.rail();
  };

  /* ---------- boot ---------- */
  function boot() {
    S.scenario = CL.scenarios[qs.get('scenario')] ? qs.get('scenario') : 'maternity';
    S.lang = qs.get('lang') === 'hi' ? 'hi' : 'en';
    S.large = qs.get('large') === '1';
    S.view = qs.get('view') === 'insurer' ? 'insurer' : 'user';
    S.instant = qs.get('instant') === '1';
    if (qs.get('shot') === '1') document.documentElement.classList.add('shot');
    resetScenario();
    const step = Math.max(0, Math.min(5, parseInt(qs.get('step') || '0', 10) || 0));
    if (qs.get('variant') && CL.sc().estimate.variants[qs.get('variant')]) S.variant = qs.get('variant');
    if (step >= 1) S.consent = true;
    if (step >= 2 || qs.get('read') === '1') S.policyRead = true;
    if (step === 2) CL.chatStart();
    if (qs.get('chat') === 'done') completeChat();
    if (step >= 3) completeChat();
    if (step >= 5) { S.precheck = 'done'; S.intimated = true; }
    if (qs.get('qa')) S.asked = qs.get('qa').split(',').map(Number).filter(n => !isNaN(n));
    if (qs.get('clause')) S.clauses[qs.get('clause')] = true;
    if (qs.get('pre') === '1') { S.precheck = 'done'; }
    if (qs.get('notice') === '1') S.intimated = true;
    if (qs.get('whatif') === '1') S.whatIf = true;
    if (qs.get('items') === '1') S.showItems = true;
    if (qs.get('tl')) S.tlIdx = qs.get('tl') === 'all' ? CL.sc().timeline.length : Math.min(CL.sc().timeline.length, +qs.get('tl') || 0);
    if (qs.get('esc') === '1') S.escalate = true;
    if (qs.get('hr') === '1') S.hrShare = true;
    S.step = step;
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-a]');
      if (!el) return;
      const fn = A[el.dataset.a];
      if (fn) fn(el.dataset.v, el, e);

    document.addEventListener('change', e => { if (e.target.id === 'scSel') A.scenario(e.target.value); });
    document.addEventListener('keydown', e => {
      if (e.target.id === 'chatIn' && e.key === 'Enter') A.send();
      if (e.key === 'Escape') CL.modal('');
    });
    CL.render(true);
  }
  CL.boot = boot;
})(window.CL);

<script>
/* ClaimLens prototype - screens part 2: Prepare, Track, Insurer view, presenter rail, read-aloud text. */
(function (CL) {
  'use strict';
  const S = CL.state, ui = CL.ui, T = CL.T, esc = CL.esc, INR = CL.INR, L = CL.L;
  const screens = CL.screens;
  const fmtM = m => (m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`);
  const local = {
    readiness: L('Readiness', 'तैयारी'),
    waiting: L('Clock running', 'घड़ी चल रही है'),
    within: L('within limit', 'सीमा के अंदर'), over: L('over the limit', 'सीमा से ऊपर'), pending: L('still pending', 'अभी बाक़ी'),
    estSaid: L('ClaimLens estimate: you pay', 'ClaimLens अनुमान: आप देंगे'), finalSaid: L('Final: you pay', 'अंतिम: आप देंगे'),
    hospNote: L('The hospital sends these directly to the insurer or TPA.', 'अस्पताल इन्हें सीधे बीमा कंपनी या TPA को भेजता है।'),
    noEvents: L('Updates appear here as the hospital, TPA and insurer act.', 'अस्पताल, TPA और बीमा कंपनी के काम करते ही अपडेट यहाँ दिखेंगे।')
  };

  /* ---------- 4. Prepare ---------- */
  screens.s4 = function () {
    const sc = CL.sc(), im = sc.intimation;
    let html = `<div class="card"><h4>📨 ${T(ui.tellInsurer)}</h4><p class="small">${T(im.rule)}</p>
      ${S.intimated ? `<span class="chip c-high">✓ ${T(ui.noticeSent)} · ${esc(im.ref)}</span><p class="xs muted" style="margin-top:6px">${T(im.sent)}</p>` : `<button class="btn btn-primary btn-block" data-a="notice">${T(ui.sendNotice)}</button>`}</div>`;
    const done = S.precheck === 'done';
    const statusOf = (d, i) => (done ? (d.status === 'warn' && S.fixed[i] ? 'ok' : d.status) : (d.pre === 'up' ? 'up' : d.pre));
    const chipCls = { ok: 'c-high', warn: 'c-medium', missing: 'c-low', pending: 'c-info', up: 'c-np' };
    const icon = { ok: '✅', warn: '⚠️', missing: '⛔', pending: '🏥', up: '📎' };
    const sts = sc.docs.map(statusOf);
    html += `<div class="card"><div class="row between"><h4>📋 ${T(ui.docs)}</h4>${done ? `<div class="ready"><span class="chip c-high">${sts.filter(s => s === 'ok').length} ${T(ui.readyLbl)}</span><span class="chip c-medium">${sts.filter(s => s === 'warn' || s === 'missing').length} ${T(ui.fixLbl)}</span><span class="chip c-info">${sts.filter(s => s === 'pending').length} ${T(ui.hospLbl)}</span></div>` : ''}</div>`;
    if (S.precheck === 'idle') html += `<button class="btn btn-soft btn-block" style="margin:6px 0" data-a="precheck">🔍 ${T(ui.runCheck)}</button>`;
    if (S.precheck === 'running') html += `<p class="small">${T(ui.checking)}</p><div class="scan"><i></i></div>`;
    html += sc.docs.map((d, i) => { const s = sts[i]; return `<div class="doc"><span class="di">${icon[s]}</span><div><div class="dn">${T(d.name)}</div>${done || s === 'pending' ? `<div class="dc">${T(d.check)}</div>` : ''}${done && d.status === 'warn' && !S.fixed[i] ? `<button class="btn-link" data-a="fix" data-v="${i}">✓ ${T(ui.markFixed)}</button>` : ''}</div><span class="chip ${chipCls[s]}">${T(ui.dstat[s])}</span></div>`; }).join('');
    html += `</div><div class="note">🛡️ ${T(L('ClaimLens only flags issues. It never edits, creates or alters a document.', 'ClaimLens केवल समस्याएँ बताता है। यह कभी कोई दस्तावेज़ बदलता, बनाता या संपादित नहीं करता।'))}</div>`;
    return html;
  };

  /* ---------- 5. Track ---------- */
  function clock(rule, evs) {
    let st = null;
    evs.forEach(ev => { if (ev.req === rule) st = { pending: true }; if (ev.tat && ev.tat.rule === rule) st = { mins: ev.tat.mins, running: !!ev.tat.running }; });
    const lim = rule === '1h' ? 60 : 180, label = rule === '1h' ? ui.rule1h : ui.rule3h;
    if (!st) return `<div class="clock"><div class="xs muted">${T(label)}</div><div class="cv">—</div><div class="xs muted">${T(ui.notYet)}</div></div>`;
    if (st.pending) return `<div class="clock"><div class="xs muted">${T(label)}</div><div class="cv">⏱</div><div class="xs muted">${T(local.waiting)}</div></div>`;
    const bad = st.running || st.mins > lim;
    return `<div class="clock ${bad ? 'bad' : 'ok'}"><div class="xs muted">${T(label)}</div><div class="cv">${fmtM(st.mins)} ${bad ? '✗' : '✓'}</div><div class="xs">${T(st.running ? local.pending : bad ? local.over : local.within)}</div></div>`;
  }
  screens.s5 = function () {
    const sc = CL.sc(), r = CL.res(), tl = sc.timeline, evs = tl.slice(0, S.tlIdx);
    const last = evs[evs.length - 1];
    const ball = last ? last.ball : 'you';
    let html = `<div class="card"><div class="owner"><div class="avatar">${esc(sc.owner.initials)}</div><div><div class="xs muted">${T(ui.caseOwner)}</div><b>${esc(sc.owner.name)}</b><div class="xs muted">${T(sc.owner.role)}</div></div></div>
      <div class="row between" style="margin-top:10px"><span class="small">${T(ui.whoNow)}</span><span class="ball">● ${T(ui.who[ball])}</span></div></div>`;
    html += `<div class="clocks">${clock('1h', evs)}${clock('3h', evs)}</div>`;
    const apprEv = evs.filter(ev => ev.approved != null).pop();
    if (apprEv) {
      const appr = CL.val(apprEv.approved, r), exp = r.expected.payable;
      html += `<div class="card" style="margin-top:11px"><div class="row between"><span class="small">${T(ui.approvedSoFar)}</span><b>${INR(appr)}</b></div><div class="row between"><span class="small">${T(ui.expected)}</span><b>${INR(exp)}</b></div>
        <p class="xs ${appr < exp ? '' : 'muted'}" style="margin-top:4px">${appr < exp ? `⚠️ ${INR(exp - appr)} ${T(ui.belowExp)}` : `✓ ${T(ui.matchesExp)}`}</p></div>`;
    }
    html += `<div class="card" style="margin-top:11px"><div class="tl">${evs.length ? evs.map((ev, i) => `<div class="ev ${ev.alert ? 'alert' : ''} ${i === evs.length - 1 ? 'new' : ''}"><span class="dot"></span><div class="when">${esc(ev.when)}<span class="who">${T(ui.who[ev.who])}</span></div><div class="what">${T(CL.val(ev.text, r))}</div></div>`).join('') : `<p class="small muted">${T(local.noEvents)}</p>`}</div>
      ${S.tlIdx < tl.length ? `<div class="row"><button class="btn btn-primary grow" data-a="tl">▶ ${T(ui.nextUpdate)} (${S.tlIdx}/${tl.length})</button><button class="btn" data-a="tlall">${T(ui.showAll)}</button></div>` : ''}</div>`;
    if (S.tlIdx >= tl.length) {
      const diff = r.final.youPay - r.finEstimate.youPay;
      html += `<div class="card recon"><h4>🧮 ${T(ui.recon)}</h4><div class="row between small"><span>${T(local.estSaid)}</span><b>${INR(r.finEstimate.youPay)}</b></div><div class="row between small"><span>${T(local.finalSaid)}</span><b>${INR(r.final.youPay)}</b></div>
        <p class="xs muted" style="margin-top:4px">${diff === 0 ? '=' : diff > 0 ? '+' + INR(diff) : '−' + INR(-diff)} · ${T(sc.reconWhy)}</p></div>`;
      if (sc.hr && S.hrShare) html += `<div class="card hr-view"><h4>👩‍💼 ${T(sc.hr.title)}</h4>${sc.hr.items.map(x => `<p class="small">✓ ${T(x)}</p>`).join('')}<p class="xs muted">🔒 ${T(sc.hr.note)}</p></div>`;
      html += `<div class="card"><div class="row between"><h4>📝 ${T(ui.raise)}</h4><button class="btn-link" data-a="esc">${S.escalate ? '−' : '+'}</button></div><p class="small muted">${T(sc.escalation.title)}</p>
        ${S.escalate ? `<textarea class="draft" aria-label="Draft">${T(sc.escalation.draft)}</textarea><p class="xs muted">${T(ui.draftNote)}</p>
        <div class="path">${ui.path.map((p, i) => `<div><b>${i + 1}</b><span>${T(p)}</span></div>`).join('')}</div>
        <div style="margin-top:10px">${S.gSent ? `<span class="chip c-high">✓ ${T(ui.grievanceSent)}</span>` : `<button class="btn btn-primary btn-block" data-a="gsend">${T(ui.sendGrievance)}</button>`}</div>` : ''}</div>
        <div class="card hero"><b>🎉 ${T(ui.done)}</b><p class="small muted">${T(L('You knew what you would pay before the bill, and you could see who had your claim at every step.', 'बिल से पहले आपको पता था कि आपको कितना देना है, और हर कदम पर दिखता रहा कि आपका क्लेम किसके पास है।'))}</p></div>`;
    }
    return html;
  };

  screens.step = n => screens['s' + n]();

  /* ---------- Insurer view (the buyer) ---------- */
  screens.insurer = function () {
    const rows = CL.order.map(k => {
      const sc = CL.scenarios[k], r = CL.results(sc);
      const t1 = sc.timeline.filter(ev => ev.tat && ev.tat.rule === '1h').map(ev => ev.tat.mins);
      const t3 = sc.timeline.filter(ev => ev.tat && ev.tat.rule === '3h' && !ev.tat.running).map(ev => ev.tat.mins).pop();
      const warns = sc.docs.filter(d => d.status === 'warn').length;
      return { k, sc, r, t1, t3, warns };
    });
    const all1 = rows.flatMap(x => x.t1), ok1 = all1.filter(m => m <= 60).length;
    const ok3 = rows.filter(x => x.t3 <= 180).length;
    const caught = rows.reduce((s, x) => s + x.warns, 0);
    const review = {
      maternity: ['Doctor registration number missing on admission advice: fixed before admission', 'Name mismatch on antenatal card: patient told to carry ID'],
      older: ['Possible undisclosed COPD: routed to medical team for review (ClaimLens does not decide)', 'Two CT scans within 48 hours: pattern flagged for clinical review, no judgement on necessity', 'Discharge approval 3h 22m: breach logged; overstay cost sits with insurer'],
      group: ['Room above cap flagged before surgery: member moved, dispute of about ₹46,000 avoided', 'Employee ID mismatch between e-card and HR: routed to HR'],
      cancer: ['Modern-treatment limit tracked across cycles: ₹3,32,000 left', 'Renewal on 1 Feb 2027 during active treatment: lapse-risk reminder sent']
    };
    const cohort = { maternity: 'Expecting mother · retail', older: 'Senior (68) · son managing', group: 'Employee · group policy', cancer: 'Cancer · repeat day care' };
    return `<div class="ins-wrap">
      <div class="ins-head"><div><div class="xs muted">YOUR INSURER · CLAIMS OPERATIONS · DEMO DATA</div><h1>ClaimLens insurer console</h1></div><span class="chip c-info">Pilot view · 4 demo cases</span></div>
      <div class="kpis">
        <div class="kpi"><div class="k">Cashless decisions within 1 hour</div><div class="v">${ok1}/${all1.length}</div><div class="s muted">Industry: 86.9% (IRDAI data, Aug 2024 to May 2025)</div></div>
        <div class="kpi"><div class="k">Discharge approvals within 3 hours</div><div class="v">${ok3}/${rows.length}</div><div class="s muted">Industry: 96.7%. Breach logged with timestamps</div></div>
        <div class="kpi"><div class="k">Avoidable query triggers caught early</div><div class="v">${caught}</div><div class="s muted">Document issues fixed before the insurer asked</div></div>
        <div class="kpi"><div class="k">Members who saw their likely payout before admission</div><div class="v">4/4</div><div class="s muted">Estimate vs final within ₹1,000 where the plan held</div></div>
      </div>
      <table class="cases"><thead><tr><th>Case</th><th>Cohort</th><th>Cashless decision</th><th>Discharge approval</th><th>Expected vs final payout</th><th>For review (not decisions)</th></tr></thead><tbody>
      ${rows.map(x => `<tr><td><b>${esc(x.sc.user.full)}</b><div class="xs muted">${esc(x.sc.policy.number)}</div></td><td>${cohort[x.k]}</td>
        <td>${x.t1.map(m => `${fmtM(m)} ${m <= 60 ? '✓' : '✗'}`).join('<br>')}</td>
        <td>${x.t3 != null ? `${fmtM(x.t3)} ${x.t3 <= 180 ? '✓' : '<span class="chip c-low">✗ breach</span>'}` : '—'}</td>
        <td>${INR(x.r.expected.payable)} / ${INR(x.r.final.payable)}</td>
        <td class="small">${review[x.k].map(s => `• ${esc(s)}`).join('<br>')}</td></tr>`).join('')}
      </tbody></table>
      <div class="ins-grid">
        <div class="card"><h4>Pilot hypotheses (targets to test, not results)</h4>
          <p class="small">• Repeat status calls per claim: <b>−30%</b> (members and HR self-serve status)</p>
          <p class="small">• Claims with avoidable rejection or query reasons (documents, late notice): <b>−20%</b></p>
          <p class="small">• Grievances and Ombudsman complaints per 10,000 claims: <b>−15%</b></p>
          <p class="small">• Cashless decisions within 1 hour: <b>86.9% → 92%+</b> (complete documents first time)</p>
          <p class="xs muted">Measured against a matched control group in a 90-day pilot on one product line.</p></div>
        <div class="card"><h4>Compliance evidence</h4>
          <p class="small">✓ Senior citizens' channel: 1 case routed; alert raised at the 3-hour mark</p>
          <p class="small">✓ 1-hour and 3-hour clocks time-stamped for every cashless case</p>
          <p class="small">✓ Every explanation cites a policy clause; rejection letters must quote terms too</p>
          <p class="small">✓ Consent log (DPDP Act 2023): purpose, scope, withdrawal</p>
          <p class="xs muted">ClaimLens never decides a claim. Claim decisions stay with the insurer.</p></div>
      </div></div>`;
  };

  /* ---------- Presenter rail ---------- */
  screens.rail = function () {
    const n = CL.rail[S.step], sc = CL.sc();
    return `<h3>Behind this screen · step ${S.step + 1} of 6</h3><h2>${esc(n.t)}</h2><ul>${n.b.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
      ${n.ai ? `<div class="box ai">🤖 ${esc(n.ai)}</div>` : ''}<div class="box guard">🛑 ${esc(n.g)}</div><div class="box value">📈 ${esc(n.v)}</div>
      <div class="foot">Scenario: <b>${esc(CL.t(sc.label))}</b>. Switch scenarios at the top: same flow, different cover. Insurer view shows what the buyer sees.</div>`;
  };

  /* ---------- Read-aloud text ---------- */
  screens.speech = function () {
    const sc = CL.sc(), r = CL.res(), t = CL.t;
    switch (S.step) {
      case 0: return t(sc.intro);
      case 1: return S.policyRead ? sc.terms.map(x => `${t(x.title)}: ${t(x.value)}.`).join(' ') : t(sc.policy.docs);
      case 2: { const b = S.chatLog.filter(e => e.from === 'bot').pop(); return b ? t(b.m.text || b.m) : ''; }
      case 3: return `${t(ui.estimate)} ${INR(r.est.total)}. ${t(ui.insurerPays)} ${INR(r.est.payable)}. ${t(ui.youPay)} ${INR(r.est.youPay)}. ` + sc.flags(r).slice(0, 2).map(f => t(f.text)).join(' ');
      case 4: return `${t(sc.intimation.rule)} ${sc.docs.map(d => t(d.name)).join(', ')}.`;
      case 5: { const ev = sc.timeline[S.tlIdx - 1]; return ev ? t(CL.val(ev.text, r)) : `${t(ui.caseOwner)}: ${sc.owner.name}.`; }
    }
    return '';
  };
})(window.CL);

</script>
<script>
  try { CL.boot(); } catch (e) { window.__errors.push('boot: ' + e.message); document.getElementById('errs').textContent = window.__errors.join(' | '); }
</script>
</body>
</html>
